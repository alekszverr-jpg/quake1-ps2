name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps2:
    name: PS2 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pinned PS2DEV toolchain
        uses: actions/cache@v4
        with:
          path: .cache/ps2dev
          key: ps2dev-${{ runner.os }}-${{ hashFiles('tools/ps2dev-lock.json') }}

      - name: Bootstrap PS2DEV
        run: python tools/bootstrap_ps2dev.py

      - name: Build NTSC
        run: python tools/build.py --video ntsc --clean --jobs 2

      - name: Build PAL
        run: python tools/build.py --video pal --clean --jobs 2

      - name: Build VESA
        run: python tools/build.py --video vesa --clean --jobs 2

      - name: Upload ELF files
        uses: actions/upload-artifact@v4
        with:
          name: quake1-ps2-elf
          path: |
            build/*/quake.elf
            build/*/quake-packed.elf
          if-no-files-found: error
          retention-days: 14
